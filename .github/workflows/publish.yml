name: Publish

# The npm publish for @truealter/sdk runs here, in this public repo, rather
# than wherever the source is authored. npm provenance attestation binds to
# the CI run's own OIDC identity, and that identity has to belong to a public
# repository for the attestation to mean anything, so the publish step has to
# live in one.
#
# What gets published is always export/main, whatever ref this workflow is
# started from. That branch is written by automation only, as a squashed
# snapshot of the release-ready source, and it is not this repo's default
# branch. Do not push export/main by hand: every commit that reaches it has
# already been built and checked upstream against that exact tree, and a
# hand-pushed commit would skip all of it.
#
# The trigger is a dispatch rather than a push to export/main, because a
# push-triggered workflow is read from the tree of the branch that was
# pushed. export/main carries only the releasable source subset and no
# .github/ at all, so this file is not on it and a push there would start
# nothing. A dispatch resolves the workflow from the ref it is given, which
# keeps this file on the default branch where it is reviewed and gated. The
# upstream job dispatches it once its export push has succeeded, so a failed
# export cannot reach npm.
#
# IT IS A REPOSITORY DISPATCH, and declaring only workflow_dispatch here is
# what broke this chain. sdk-publish.yml upstream sends
# `gh api --method POST repos/true-alter/sdk/dispatches -f
# event_type=sdk-export-published`, deliberately, because the loom-promote App
# carries contents:write and actions:none and `gh workflow run` 403'd on every
# release from 2026-08-12. A repository dispatch cannot start a workflow that
# does not name that event, and it returns 204 either way, so the mismatch
# fails silently and green; the upstream job's observe step is what turns it
# red. This repo was recreated on 2026-08-28 and its seed carried a publish.yml
# from before that redesign, which is how the two came apart. workflow_dispatch
# stays for a maintainer running it by hand. Anchor:
# lesson-a-lesson-rows-repaired-clause-outlived-the-repo-it-repaired-so-the-
# cli-mirror-reads-as-having-a-publisher-it-has-never-had-2026-09-01.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sdk-export-published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level, so the widening is scoped to the one job that needs it and
    # the workflow default above stays read. `contents: write` is what the
    # release step below needs and nothing else here uses it. `id-token` is
    # repeated because a job-level block REPLACES the workflow default rather
    # than adding to it, and dropping it would silently break the OIDC that
    # trusted publishing depends on.
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: export/main

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The npm a Node image happens to carry is not a floor. npm's OIDC
      # exchange with the registry arrived in 11.5.1, and this step makes the
      # version a fact in the log rather than something a later reader has to
      # go and find. true-alter/cli runs the same step and stages cleanly
      # under npm 12.0.2. This job's last failure ran under the bundled
      # 11.17.0, which already clears that floor, so the npm version is NOT
      # the cause here and pinning it is what takes that answer off the table
      # rather than what fixes anything.
      - name: Say which npm is publishing, and hold it above the OIDC floor
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version
          node --version

      - run: npm install --no-audit --no-fund

      - run: npm run typecheck

      # NO `npm test` HERE, AND ITS ABSENCE IS THE DESIGN. The upstream export
      # deliberately omits tests/ from the curated subset, on the stated
      # grounds that a fixture is written to be realistic and that is exactly
      # what makes it dangerous on a public repo, and that npm never ships
      # tests either way because the package `files` field is an allowlist of
      # dist/, README and LICENSE. So export/main carries no test files at all
      # and vitest exits 1 on finding none. A test step here and a tests-free
      # export are mutually unsatisfiable: this workflow had never completed a
      # single run before 2026-08-12, and that contradiction is why. The suite
      # runs upstream against this exact tree before the export is cut, which
      # is the same reasoning this file's header already gives for trusting
      # export/main at all, and typecheck and build below still run against
      # the exported source. Restoring this step means exporting tests/ first.
      # Anchor: finding-the-d-1-repointed-sdk-publish-chain-has-never-run-
      # end-to-end-and-refuses-by-construction-2026-08-12.

      - run: npm run build

      - name: Pre-publish sanity (packed tarball has a real dist/)
        run: |
          set -euo pipefail
          npm pack
          tarball=$(ls truealter-sdk-*.tgz)
          tmp=$(mktemp -d)
          tar -xzf "$tarball" -C "$tmp"
          if [ ! -d "$tmp/package/dist" ]; then
            echo "::error::publish: packed SDK tarball has no package/dist. Refusing to publish."
            exit 1
          fi
          rm -f "$tarball"

      - name: Publish to npm
        # This repo carries no secrets. Authentication is npm's OIDC trusted
        # publishing, which is why the job needs id-token: write and no token.
        # Trusted publishing is configured per package against one repository
        # and one workflow path, so this file's path is part of that config.
        #
        # --loglevel verbose IS THE POINT OF THIS STEP AND IS NOT DEBUG RESIDUE.
        # npm attempts the OIDC exchange unconditionally and it is written never
        # to throw: every way it can fail returns undefined behind a log.verbose
        # or log.silly line that a default run never prints (npm/cli, lib/utils/
        # oidc.js). setup-node writes an .npmrc reading
        # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and, with no secret
        # to fill it, sets that variable to the literal placeholder
        # XXXXX-XXXXX-XXXXX-XXXXX. So a refused exchange does not stop the step,
        # it falls through to publishing under a placeholder token, and the
        # registry answers `404 Not Found - PUT` on a package that is plainly
        # there at 0.5.10. Run 33697926979 is exactly that and it named nothing:
        # no OIDC line appears anywhere in its log. Verbose is what turns the
        # registry's own rejection message into something the log says out loud.
        #
        # VERBOSE MADE THE CAUSE PRINTABLE. THE ASSERTION BELOW MAKES IT THE
        # VERDICT. Run 33719652547 on 2026-09-03 printed
        # `npm verbose oidc Failed token exchange request with body message:
        # OIDC token exchange error - package not found`, and then failed with
        # `404 Not Found - PUT`, which is the unauthenticated retry rather than
        # the fault. Three sessions across two days diagnosed that second
        # failure, because the step's exit status describes the retry and says
        # nothing about the exchange. So the log is captured, replayed in full,
        # and searched for the exchange's own refusal, which is reported as the
        # error whatever npm's own status happens to be.
        #
        # The capture keeps the step's real status for every other failure, so
        # a genuine publish error still fails with its own message and this
        # adds nothing to it. Anchor: finding-the-sdk-oidc-exchange-404s-
        # package-not-found-while-mcp-ollama-403s-permission-denied-so-the-two-
        # refusals-are-different-and-the-staged-shape-answers-only-one-
        # 2026-09-03, which records this rung as owed.
        run: |
          set -uo pipefail
          status=0
          npm publish --access public --provenance --loglevel verbose \
            > publish.log 2>&1 || status=$?
          cat publish.log
          if grep -q 'Failed token exchange request' publish.log; then
            line=$(grep -m1 'Failed token exchange request' publish.log)
            echo "::error::publish: the registry REFUSED the OIDC exchange, so npm fell through to an unauthenticated PUT and the status below describes that retry, not the fault. ${line}"
            exit 1
          fi
          exit "$status"

      - name: Cut the release this repo has never carried
        # Measured 2026-09-01: true-alter/sdk held ZERO tags and ZERO releases.
        # The npm `repository` field points here, so the page a reader reaches
        # from the listing looked like a repo nobody had ever released. The
        # same hole sits on true-alter/cli and on true-alter/runtime, and on
        # the runtime it already blocks something. The 2026-08-26 ruling
        # disowning the AUR package names "until the public mirror carries
        # releases" as its own condition.
        #
        # THE TAG GOES ON export/main, WHICH IS NOT THIS REPO'S DEFAULT BRANCH.
        # That is deliberate and it is what the checkout above already reads.
        # export/main is the curated snapshot the publish is cut from, so it
        # is the only ref where a tag names the bytes that reached npm.
        #
        # IDEMPOTENT. A re-dispatch on a version already tagged stands down
        # rather than failing, which matters because the npm publish above is
        # not idempotent and a re-run reaches here only after it succeeded.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release: ${tag} already exists, nothing to cut."
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          notes=$(mktemp)
          {
            echo "\`@truealter/sdk@${version}\` is live on npm with provenance."
            echo
            echo '```'
            echo "npm install @truealter/sdk"
            echo '```'
            # This version's CHANGELOG section, keyed on the version and NOT
            # on position, because the newest section in these files is
            # `## [Unreleased]` and taking it would put unreleased work in
            # every release note. Absent file or absent section yields zero
            # bytes and the release goes out with the install line alone;
            # export/main carries only the curated subset, so the file may
            # genuinely not be here.
            if [ -f CHANGELOG.md ]; then
              body=$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## /{exit} f{print}' CHANGELOG.md)
              if [ -n "$body" ]; then
                echo
                echo "$body"
              fi
            fi
          } > "$notes"
          gh release create "$tag" --title "$tag" --notes-file "$notes" --target "$sha"
          echo "release: cut ${tag} at ${sha} on export/main."
